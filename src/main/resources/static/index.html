<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Knowledge Base - 本地文件内容搜索</title>
    <link rel="stylesheet" href="style.css?v=20261031b">
    <link rel="stylesheet" href="lib/highlight/github.min.css?v=20261031">
</head>
<body>
<header class="topbar">
    <div class="brand">📚 Knowledge Base</div>
    <nav class="nav">
        <button id="nav-search" class="nav-btn active" data-view="search">搜索</button>
        <button id="nav-libraries" class="nav-btn" data-view="libraries">库管理</button>
        <button id="nav-settings" class="nav-btn" data-view="settings">设置</button>
    </nav>
</header>

<main>
    <!-- ============ 搜索视图 ============ -->
    <section id="view-search" class="view">
        <form id="search-form" class="search-bar">
            <input id="search-input" type="text" placeholder="输入关键词，搜索文件内容…" autocomplete="off" autofocus>
            <select id="search-lib" title="选择要搜索的库">
                <option value="">所有库</option>
            </select>
            <button type="submit" class="primary">搜索</button>
        </form>

        <div class="search-filters">
            <input id="search-ext" type="text" placeholder="文件类型，如 pdf,docx（留空不限）">
            <span class="filter-label">修改时间</span>
            <input id="search-from" type="date" title="修改时间从">
            <span class="filter-sep">至</span>
            <input id="search-to" type="date" title="修改时间至">
        </div>

        <div id="search-status" class="muted" hidden></div>

        <div id="search-results" class="result-list"></div>

        <div id="pagination" class="pagination" hidden>
            <button id="page-prev">上一页</button>
            <span id="page-info"></span>
            <button id="page-next">下一页</button>
        </div>
    </section>

    <!-- ============ 预览视图（覆盖层） ============ -->
    <div id="preview-overlay" class="overlay" hidden>
        <div class="preview-panel">
            <div class="preview-head">
                <span id="preview-title"></span>
                <button id="preview-close" title="关闭">✕</button>
            </div>
            <div id="preview-body" class="preview-body"></div>
            <div class="preview-resize preview-resize-e" data-dir="e" title="拖动调整宽度"></div>
            <div class="preview-resize preview-resize-s" data-dir="s" title="拖动调整高度"></div>
            <div class="preview-resize preview-resize-se" data-dir="se" title="拖动调整大小"></div>
        </div>
    </div>

    <!-- ============ 库管理视图 ============ -->
    <section id="view-libraries" class="view" hidden>
        <div class="panel">
            <div class="panel-head">
                <h2>库列表</h2>
                <form id="lib-create-form" class="inline-form">
                    <input id="lib-create-name" type="text" placeholder="新库名称…" required>
                    <button type="submit" class="primary">新建库</button>
                </form>
            </div>
            <div id="library-list" class="library-list"></div>
        </div>
    </section>

    <!-- ============ 设置视图 ============ -->
    <section id="view-settings" class="view" hidden>
        <div class="panel narrow">
            <h2>系统设置</h2>
            <form id="settings-form">
                <label for="settings-index-root">索引存储位置</label>
                <input id="settings-index-root" type="text" placeholder="留空使用默认位置（./data/indexes）">
                <p class="hint">修改后要求新目录为空（不存在会自动创建），已有索引数据会自动迁移到新位置。</p>

                <label for="settings-port">服务端口（1-65535）</label>
                <input id="settings-port" type="number" min="1" max="65535" placeholder="留空表示不修改">
                <p class="hint" id="settings-port-hint"></p>

                <label for="settings-analyzer">中文分词器</label>
                <select id="settings-analyzer">
                    <option value="smartcn">SmartChinese（Lucene 自带）</option>
                    <option value="ik">IK 中文分词</option>
                </select>
                <p class="hint">切换分词器后建议对相关库执行「重建索引」，以保证搜索效果一致。</p>

                <label for="settings-supported-exts">可索引的文件类型</label>
                <textarea id="settings-supported-exts" rows="4"
                    placeholder="用逗号分隔，如 txt,md,pdf,docx"></textarea>
                <p class="hint">只有这些扩展名的文件会被建入索引。修改后对<strong>之后的新建/重建索引</strong>生效，已有索引不变。支持中英文逗号、分号、空格分隔，扩展名前的点会被自动忽略。</p>

                <label for="settings-page-size">每页显示结果数量（1-100）</label>
                <input id="settings-page-size" type="number" min="1" max="100" placeholder="20">

                <label for="settings-last-library">上次使用的库</label>
                <select id="settings-last-library">
                    <option value="">（不记录）</option>
                </select>

                <button type="submit" class="primary">保存设置</button>
                <span id="settings-msg" class="msg"></span>
            </form>
        </div>
    </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="lib/marked/marked.min.js?v=20261031"></script>
<script src="lib/highlight/highlight.min.js?v=20261031"></script>
<script src="app.js?v=20261031b"></script>
</body>
</html>
