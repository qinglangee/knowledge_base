server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: knowledge-base
  datasource:
    url: jdbc:h2:file:./data/kb-meta
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    com.kb: info
