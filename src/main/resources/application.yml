server:
  address: 127.0.0.1
  port: 8080

# 允许通过 data/app.properties 覆盖配置（如 server.port），优先级高于本文件
spring:
  config:
    import: optional:file:./data/app.properties
  application:
    name: knowledge-base
  datasource:
    url: jdbc:h2:file:./data/kb-meta
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # 本地工具：禁用静态资源浏览器缓存，避免改完前端后浏览器仍用旧版
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

logging:
  level:
    com.kb: info
